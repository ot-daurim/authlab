services:
  authlab-db:
    image: postgres:18
    container_name: authlab
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - authlab-postgres18-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "authlab", "-d", "authlab"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  authlab-postgres18-data: